name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Go build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (for //go:embed)
        working-directory: frontend
        run: npm ci --legacy-peer-deps && npm run build
      - name: Stage dist for embed
        run: mkdir -p frontend/dist && cp -r ../frontend/dist frontend/dist
      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  binary:
    name: Build standalone binary (embed frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci --legacy-peer-deps && npm run build
      - name: Copy dist for embed
        run: mkdir -p backend/frontend && cp -r frontend/dist backend/frontend/dist
      - name: Build static binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../tlog-web-linux-amd64 .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlog-web-linux-amd64
          path: tlog-web-linux-amd64
